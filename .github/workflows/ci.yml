name: Formix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Update golden files'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze

      - name: Update Goldens (Manual)
        if: github.event.inputs.update_goldens == 'true'
        run: |
          flutter test --update-goldens
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add test/goldens/
          git commit -m "chore: update golden files [skip ci]" || echo "No changes to commit"
          git push

      - name: Run tests
        if: github.event.inputs.update_goldens != 'true'
        run: flutter test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Measured on CI because `flutter test --coverage` hangs in the local
      # toolchain (flutter_tools CoverageCollector defect on some 3.47.x setups).
      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Report coverage %
        run: |
          PCT=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{if(lf>0) printf "%.2f", lh/lf*100}' coverage/lcov.info)
          echo "Line coverage: ${PCT}%"
          echo "### 🧪 Line coverage: ${PCT}%" >> "$GITHUB_STEP_SUMMARY"
          THRESHOLD=90
          awk -v p="$PCT" -v t="$THRESHOLD" 'BEGIN{exit (p+0 < t) ? 1 : 0}' \
            || { echo "::error::Coverage ${PCT}% is below ${THRESHOLD}% threshold"; exit 1; }

      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
